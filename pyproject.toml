[project]
name = "qt-pinn"
version = "0.1.0"
description = "Is the quantum circuit necessary? Classifiability-predicted ablation of Quantum-Train weight generation for a 2D Burgers' PINN."
requires-python = ">=3.12"
dependencies = [
    "pennylane",
    "pennylane-lightning",
    "torch",
    "quimb",
    "scipy",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_pinn"]
