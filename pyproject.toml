[project]
name = "qt-pinn"
version = "0.1.0"
description = "Is the quantum circuit necessary? Classifiability-predicted ablation of Quantum-Train weight generation for a 2D Burgers' PINN."
requires-python = ">=3.12"
dependencies = [
    "pennylane",
    "pennylane-lightning",
    "torch",
    "scipy",
    "numpy",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
baselines = [
    "quimb",      # MPS baseline; requires numba which doesn't support Python 3.12 via old quimb
    "numba>=0.56.0",  # force a Python-3.12-compatible numba build
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_pinn", "pdes"]
