fourier:
  sigma: 1.0
  seed:  42

quantum:
  n_layers:      3
  partition_seed: 0

mlp:
  hidden: [16, 16]

physics:
  nu: 0.003183

training:
  seed:         0
  n_colloc:     256   # 512 hurts — circuit's 81 params can't cover more constraints
  n_bc:         64
  structured_bc: false
  weight_reg:   0.1   # L2 on generated MLP weights only (no double penalty)

  lambda_bc:             7.0
  adaptive_lambda:       false
  adaptive_lambda_alpha: 0.9
  adaptive_lambda_every: 1
  adaptive_lambda_warmup: 1000
  lambda_max:            5.0

  cosine_annealing: true
  cosine_eta_min:   1.0e-5
  warmup_steps:     0
  resample_every:   0
  log_every: 500

  adam:
    lr:           0.01
    steps:        18000
    weight_decay: 0.0   # removed — weight_reg already regularises; double penalty hurts amplitude

  lbfgs:
    lr:       0.1
    steps:    0
    max_iter: 10
