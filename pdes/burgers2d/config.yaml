fourier:
  sigma: 0.1
  seed:  42

quantum:
  n_layers:      3
  partition_seed: 0

mlp:
  hidden: [32, 32]
  omega_0: 30.0   # SIREN periodic activation frequency (Sitzmann et al. 2020)

physics:
  nu: 0.003183

training:
  seed:         0
  n_colloc:     4096
  n_bc:         4096
  structured_bc: false
  weight_reg:   0.1   # L2 on generated MLP weights only (no double penalty)

  lambda_bc:             1.0
  adaptive_lambda:       false
  adaptive_lambda_alpha: 0.9
  adaptive_lambda_every: 1
  adaptive_lambda_warmup: 1000
  lambda_max:            5.0

  cosine_annealing: true
  cosine_eta_min:   1.0e-5
  warmup_steps:     0
  resample_every:   0
  log_every: 500
  grad_clip_norm:   1.0   # train_gpu.py only — fixes Adam loss spikes at lambda_bc>=1

  adam:
    lr:           0.005
    steps:        18000
    weight_decay: 0.0   # removed — weight_reg already regularises; double penalty hurts amplitude

  lbfgs:
    lr:       0.1
    steps:    0
    max_iter: 10
