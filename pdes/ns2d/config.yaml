fourier:
  # For TGV on [0,2pi]: wavenumber k needs B ~ k/(2pi).
  # Random sigma=1.0 / 2.0 is ~6-12x too high. Use 0.25 or deterministic TGV basis.
  sigma: 0.25
  seed:  42
  mode:  tgv_deterministic   # random | tgv_deterministic

quantum:
  n_layers:      3
  partition_seed: 0

mlp:
  hidden: [32, 32]
  out_dim: 3       # u, v, p  (Burgers used 2)
  omega_0: 30.0

physics:
  nu: 0.01         # kinematic viscosity; Re ~ 100 for Taylor-Green at unit amplitude
  # Taylor-Green vortex decay on [0, 2pi]^2
  # u(x,y,t) =  sin(x)cos(y)exp(-2*nu*t)
  # v(x,y,t) = -cos(x)sin(y)exp(-2*nu*t)
  # p(x,y,t) = +(cos(2x)+cos(2y))*exp(-4*nu*t)/4   # + sign for this velocity convention
  domain_x: [0.0, 6.2831853]   # [0, 2pi]
  domain_y: [0.0, 6.2831853]
  domain_t: [0.0, 1.0]

training:
  seed:         0
  n_colloc:     4096
  n_bc:         4096
  structured_bc: false
  weight_reg:   0.1
  hard_ic:      false   # A4: u = u_IC + t*N_u (bc_loss ≡ 0 by construction)

  lambda_bc:             1.0
  adaptive_lambda:       false
  adaptive_lambda_alpha: 0.9
  adaptive_lambda_every: 1
  adaptive_lambda_warmup: 1000
  lambda_max:            5.0

  cosine_annealing: true
  cosine_eta_min:   1.0e-5
  warmup_steps:     0
  resample_every:   0
  log_every: 500
  grad_clip_norm:   1.0

  adam:
    lr:           0.005
    steps:        18000
    weight_decay: 0.0

  lbfgs:
    lr:       0.1
    steps:    0
    max_iter: 10
